<script id="fa-core">
/* Shared crypto + session helpers for the password gate and the User Manager.
   protect.py inlines this file into every protected page and into admin/index.html.
   Must stay in step with the key derivation in protect.py:
     master      = PBKDF2-SHA256(admin password, users.salt, users.iter)
     page key    = HMAC-SHA256(master, "page:" + slug)       (slug "home" = landing page)
     admin key   = HMAC-SHA256(master, "admin")               (encrypts user metadata)
     check       = HMAC-SHA256(master, "check")               (verifies the admin password)
     all key     = HMAC-SHA256(master, "all")                 (super users hold this one key)
     vault[slug] = page key (base64) encrypted with the all key; users.vault, kept current by
                   protect.py, so super users can open every page, including ones added later
     pdf key     = HMAC-SHA256(master, "pdf:" + slug)        (encrypts <slug>/page-pdf.bin)
     dvault[slug]= pdf key encrypted with the all key, only for solutions whose Download switch is on
     policy[slug]= {read, download}: global switches set in the User Manager (missing = both on).
                   Read off: the page key leaves every keyring and the vault. Download off: the pdf key
                   leaves every keyring and the dvault, and download options are hidden.
     user key    = PBKDF2-SHA256(user password, user.s, users.iter)  (encrypts the user's keyring)
     user id     = SHA-256(users.salt + "|" + lower(username)) as hex
*/
var FA = (function () {
  var te = new TextEncoder(), td = new TextDecoder();
  var SESSION = "faclon-glossary-session";
  function u8(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); }
  async function pbkdf2(pw, salt, iter) {
    var k = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: iter }, k, 256));
  }
  async function hmac(raw, msg) {
    var k = await crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    return new Uint8Array(await crypto.subtle.sign("HMAC", k, te.encode(msg)));
  }
  async function encrypt(raw, text) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt"]);
    return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, te.encode(text))) };
  }
  async function decrypt(raw, iv, ct) {
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(iv) }, k, u8(ct)));
  }
  async function decryptBytes(raw, iv, ct) {
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, ct);
  }

    var h = new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode(s)));
    return Array.prototype.map.call(h, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
  }

  function pageKey(master, slug) { return hmac(master, "page:" + slug); }
  function allKey(master) { return hmac(master, "all"); }
  function pdfKey(master, slug) { return hmac(master, "pdf:" + slug); }
  function canRead(U, slug) { var p = (U.policy || {})[slug]; return slug === "home" || !p || p.read !== false; }
  function canDownload(U, slug) { var p = (U.policy || {})[slug]; return slug !== "home" && canRead(U, slug) && (!p || p.download !== false); }
  /* Rebuilds the super-user vaults from the policy (admin only): vault = readable page keys,
     dvault = downloadable pdf keys, both locked with the all key. Returns true if anything changed. */
  async function syncVault(U, master, slugs) {
    var ak = await allKey(master), changed = false;
    var vault = {}, dvault = {}, ov = U.vault || {}, od = U.dvault || {};

      var sl = slugs[i];
      if (canRead(U, sl)) { if (ov[sl]) vault[sl] = ov[sl]; else { vault[sl] = await encrypt(ak, b64(await pageKey(master, sl))); changed = true; } }

  async function buildRing(U, master, meta) {

    if (meta.all) { ring.all = 1; ring.a = b64(await allKey(master)); return ring; }
    var pages = meta.pages || [];

  }
  async function loadUsers(base) {

  }

  }

  async function login(U, username, pw) {

    }

    var e = (U.users || []).filter(function (x) { return x.id === id; })[0];

  }

  async function access(U, s) {

      var m = u8(s.k);
      if (b64(await hmac(m, "check")) !== U.check) throw new Error("stale");

        key: function (slug) { return pageKey(m, slug); }, dkey: function (slug) { return pdfKey(m, slug); } };

    if (ring.all) {
      var ak = u8(ring.a);
      var open = async function (box, slug) {
        var v = (box || {})[slug]; if (!v) return null;
        try { return u8(await decrypt(ak, v.iv, v.ct)); } catch (x) { return null; }
      };
      return {
        name: ring.n, admin: false, superUser: true,
        allowed: Object.keys(U.vault || {}), downloadable: Object.keys(U.dvault || {}),
        key: function (slug) { return slug === "home" && ring.p && ring.p.home ? Promise.resolve(u8(ring.p.home)) : open(U.vault, slug); },
        dkey: function (slug) { return open(U.dvault, slug); }
      };
    }
    var d = ring.d || {};
    return {
      name: ring.n, admin: false, allowed: Object.keys(ring.p), downloadable: Object.keys(d),
      key: function (slug) { return Promise.resolve(ring.p[slug] ? u8(ring.p[slug]) : null); },
      dkey: function (slug) { return Promise.resolve(d[slug] ? u8(d[slug]) : null); }
    };
  }
  function getSession() { try { return JSON.parse(localStorage.getItem(SESSION) || sessionStorage.getItem(SESSION) || "null"); } catch (e) { return null; } }
  function setSession(v) { var j = JSON.stringify(v); try { localStorage.setItem(SESSION, j); } catch (e) { try { sessionStorage.setItem(SESSION, j); } catch (e2) {} } }
  function clearSession() { try { localStorage.removeItem(SESSION); sessionStorage.removeItem(SESSION); localStorage.removeItem("faclon-glossary-key"); } catch (e) {} }
  return {
    u8: u8, b64: b64, pbkdf2: pbkdf2, hmac: hmac, encrypt: encrypt, decrypt: decrypt, decryptBytes: decryptBytes, sha256hex: sha256hex,
    norm: norm, userId: userId, pageKey: pageKey, allKey: allKey, pdfKey: pdfKey, canRead: canRead, canDownload: canDownload, syncVault: syncVault, fillVault: fillVault, buildRing: buildRing, loadUsers: loadUsers, adminMaster: adminMaster,
    login: login, access: access, getSession: getSession, setSession: setSession, clearSession: clearSession
  };
})();

</script>

var u; try { u = new URL(a.getAttribute(\"href\"), location.href); } catch (e) { return; }\n    if (u.origin !== location.origin || u.pathname.indexOf(base) !== 0) return;\n    var seg = u.pathname.slice(base.length).split(\"/\")[0];\n    if (slugs.indexOf(seg) < 0 || A.indexOf(seg) >= 0) return;\n    var c = a.closest(\"article.card\"); (c || a).style.display = \"none\";\n  });\n\n  // 2. signed-in bar (in a shadow root so page styles can't touch it)\n  var host = document.createElement(\"div\");\n  host.setAttribute(\"style\", \"position:fixed;right:12px;bottom:12px;z-index:2147483000\");\n  document.body.appendChild(host);\n  var root = host.attachShadow ? host.attachShadow({ mode: \"open\" }) : host;\n  root.innerHTML = '<style>' +\n    ':host,*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,\"Segoe UI\",sans-serif}' +\n    '.bar{display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);background:#fff;color:#0F1B2D;border:1px solid #E3E8EF;border-radius:999px;padding:6px 6px 6px 14px;font-size:13px;font-weight:500;box-shadow:0 6px 24px rgba(11,26,48,.14)}' +\n    '.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}' +\n    'button{font:600 12px Inter,system-ui,sans-serif;border:0;border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap;background:#EEF2FF;color:#3D63F5}' +\n    'button.pri{background:#3D63F5;color:#fff}button:disabled{opacity:.55;cursor:default}' +\n    '.scrim{position:fixed;inset:0;background:rgba(11,26,48,.5);display:flex;align-items:center;justify-content:center;padding:16px}' +\n    '.dlg{background:#fff;color:#0F1B2D;border-radius:14px;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(11,26,48,.3)}' +\n    '.dlg h2{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}' +\n    '.eb{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#3D63F5;margin:18px 0 6px}' +\n    'p{margin:0;font-s   var args=[acc.allowed,acc.name,acc.admin,D.base,U.solutions||[],D.slug,acc.downloadable,U.policy||{}].map(function(v){return JSON.stringify(v).replace(/</g,"\\u003c")}).join(",");
  var js='<script>'+$("fa-core").textContent+'\n'+TOOLS+'\nFTOOLS('+args+')<\/script>';
  var i=html.toLowerCase().lastIndexOf("</body>");
  return i<0?html+js:html.slice(0,i)+js+html.slice(i);
}
function show(html){function go(){document.open();document.write(html);document.close()}if(document.readyState==="complete")go();else window.addEventListener("load",go)}
async function open(U,acc){
  var k=await acc.key(D.slug);
  if(!k){gate.hidden=true;$("who").textContent=acc.name;if(!FA.canRead(U,D.slug)){$("nah").textContent="This solution isn't available right now";$("nap").textContent="It has been switched off for all users. Ask your Faclon contact if you need it."}$("home").href=D.base||"./";noacc.hidden=false;return}
  show(after(await FA.decrypt(k,D.iv,D.ct),acc,U));
}

var U;
try{U=await FA.loadUsers(D.base)}catch(e){gate.style.visibility="visible";err.textContent="Couldn't reach the site. Check your connection and reload.";$("go").disabled=true;return}
var s=FA.getSession();
if(s){try{await open(U,await FA.access(U,s));return}catch(e){FA.clearSession();if(e.message==="removed")$("lead").textContent="Your access has changed. Please sign in again."}}
gate.style.visibility="visible";$("u").focus();
$("f").addEventListener("submit",async function(e){
  e.preventDefault();var b=$("go");b.disabled=true;b.textContent="Checking…";err.textContent="";
  try{var s=await FA.login(U,$("u").value,$("pw").value);var acc=await FA.access(U,s);FA.setSession(s);await open(U,acc)}
  catch(x){err.textContent="That username and password didn't match. Try again.";b.disabled=false;b.textContent="Sign in"}
});
