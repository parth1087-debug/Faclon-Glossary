<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0B1A30;color:#fff;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;background:#13264A;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:32px 28px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7C95FF}

p{font-size:14px;color:#B6C2D6;line-height:1.5}

<body>
<div class="card" id="gate" style="visibility:hidden">
  <div class="eyebrow">Faclon Labs</div>
  <h1>Sign in</h1>
  <p id="lead">These solution pages are shared privately. Sign in with the username and password you were given.</p>
  <form id="f" autocomplete="on">
    <input id="u" type="text" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">Sign in</button>
  </form>
</div>
<div class="card" id="noacc" hidden>
  <div class="eyebrow">Faclon Labs</div>
  <h1 id="nah">No access to this page</h1>
  <p id="nap">You're signed in as <b id="who"></b>, but this solution hasn't been shared with you. Ask your Faclon contact if you need it.</p>
  <div class="acts"><a class="btn" id="home" href="#">See your solutions</a><button class="ghost" id="out" type="button">Sign in as someone else</button></div>
</div>
<script id="fa-core">
/* Shared crypto + session helpers for the password gate and the User Manager.
   protect.py inlines this file into every protected page and into admin/index.html.
   Must stay in step with the key derivation in protect.py:
     master      = PBKDF2-SHA256(admin password, users.salt, users.iter)
     page key    = HMAC-SHA256(master, "page:" + slug)       (slug "home" = landing page)
     admin key   = HMAC-SHA256(master, "admin")               (encrypts user metadata)
     check       = HMAC-SHA256(master, "check")               (verifies the admin password)
     all key     = HMAC-SHA256(master, "all")                 (super users hold this one key)
     vault[slug] = page key (base64) encrypted with the all key; users.vault, kept current by
                   protect.py, so super users can open every page, including ones added later
     pdf key     = HMAC-SHA256(master, "pdf:" + slug)        (encrypts <slug>/page-pdf.bin)
     dall key    = HMAC-SHA256(master, "dall")                (super users with the Can download right)
     dvault[slug]= pdf key encrypted with the dall key, only for solutions whose Download switch is on
     contrib key = HMAC-SHA256(master, "contrib")             (contributors hold it; unlocks users.contrib.tok)
     upload key  = HMAC-SHA256(contrib key, "page:" + slug)  page key of a contributor upload (users.uploads)
     spub/spriv  = ECDH P-256 key pair; spriv (PKCS8) is locked with the all key. Contributors lock a new
                   upload's page key to spub, so super users see uploads at once: vault entry {e, iv, ct}.
     policy[slug]= {read, download}: global switches set in the User Manager (missing = both on).
                   Read off: the page key leaves every keyring and the vault. Download off: the pdf key
                   leaves every keyring and the dvault, and download options are hidden.
     guides      = GUIDES (the Read me): not solutions. Encrypted with the landing-page key so every signed-in
                   user can open them; never in solutions, keyrings, vaults or downloads. Mirror of GUIDES in protect.py.
     versions[slug] = {of: first version's slug, n: version number}. A newer version of a solution is a
                   separate page with the same name; the first version has no entry (it is v1). The version
                   number is shown next to the name (chip, "Name v2" in lists) and can't be edited. Uploads add entries; the User
                   Manager's "use latest" turns Read off for older versions and gives users the newest.
     cats[slug]  = category id from CATS: groups solutions on the landing page. A version always has its
                   solution's category. Set at upload (required for a new solution, copied for a version), changed
                   in the User Manager, filled in by protect.py (from the landing page's data-cat) for pages without
                   one. Mirror of CATS in protect.py and src/home/build_home.py.
     keyring     = {n, p:{slug:page key}, d:{slug:pdf key}, c?: contrib key, all?/a?/da?: super user}
     user key    = PBKDF2-SHA256(user password, user.s, users.iter)  (encrypts the user's keyring)
     user id     = SHA-256(users.salt + "|" + lower(username)) as hex

var FA = (function () {

  var SESSION = "faclon-glossary-session";
  function u8(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); }

    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: iter }, k, 256));
  }
  async function hmac(raw, msg) {

  async function encrypt(raw, text) {
    var iv = crypto.getRandomValues(new Uint8Array(12));

    return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, te.encode(text))) };
  }
  async function decrypt(raw, iv, ct) {
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(iv) }, k, u8(ct)));
  }
  async function decryptBytes(raw, iv, ct) {
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, ct);

  function userId(U, username) { return sha256hex(U.salt + "|" + norm(username)); }
  function pageKey(master, slug) { return hmac(master, "page:" + slug); }
  function allKey(master) { return hmac(master, "all"); }
  function dallKey(master) { return hmac(master, "dall"); }
  function contribKey(master) { return hmac(master, "contrib"); }
  function uploadKey(c, slug) { return hmac(c, "page:" + slug); }
  var GUIDES = { readme: 1 };
  function isGuide(slug) { return GUIDES.hasOwnProperty(slug); }
  function isUpload(U, slug) { return !!(U.uploads || {})[slug]; }
  async function keyFor(U, master, slug) { if (isGuide(slug)) return pageKey(master, "home"); return isUpload(U, slug) ? uploadKey(await contribKey(master), slug) : pageKey(master, slug); }
  function pdfKey(master, slug) { return hmac(master, "pdf:" + slug); }
  function canRead(U, slug) { var p = (U.policy || {})[slug]; return slug === "home" || !p || p.read !== false; }
  function canDownload(U, slug) { var p = (U.policy || {})[slug]; return slug !== "home" && !isGuide(slug) && canRead(U, slug) && (!p || p.download !== false); }
  async function sha256(buf) { return new Uint8Array(await crypto.subtle.digest("SHA-256", buf)); }
  /* Locks a page key to the super-user public key (contributors use this; no admin secret needed). */
  async function wrapForSuper(U, key) {
    if (!U.spub) return null;
    var pub = await crypto.subtle.importKey("raw", u8(U.spub), { name: "ECDH", namedCurve: "P-256" }, false, []);
    var eph = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    var aes = await sha256(await crypto.subtle.deriveBits({ name: "ECDH", public: pub }, eph.privateKey, 256));
    var box = await encrypt(aes, b64(key));
    return { e: b64(await crypto.subtle.exportKey("raw", eph.publicKey)), iv: box.iv, ct: box.ct };
  }
  async function unwrapSuper(U, ak, v) {
    var der = u8(await decrypt(ak, U.spriv.iv, U.spriv.ct));
    var priv = await crypto.subtle.importKey("pkcs8", der, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
    var pub = await crypto.subtle.importKey("raw", u8(v.e), { name: "ECDH", namedCurve: "P-256" }, false, []);
    var aes = await sha256(await crypto.subtle.deriveBits({ name: "ECDH", public: pub }, priv, 256));

  }
  /* Rebuilds the super-user vaults from the policy (admin only): vault = readable page keys (all key),

  async function syncVault(U, master, slugs) {
    var ak = await allKey(master), dk = await dallKey(master), changed = false;
    var vault = {}, dvault = {}, ov = U.vault || {}, od = U.dvault || {};
    for (var i = 0; i < slugs.length; i++) {
      var sl = slugs[i];
      if (canRead(U, sl)) { if (ov[sl]) vault[sl] = ov[sl]; else { vault[sl] = await encrypt(ak, b64(await keyFor(U, master, sl))); changed = true; } }
      else if (ov[sl]) changed = true;
      if (canDownload(U, sl)) { if (od[sl]) dvault[sl] = od[sl]; else { dvault[sl] = await encrypt(dk, b64(await pdfKey(master, sl))); changed = true; } }
      else if (od[sl]) changed = true;
    }
    U.vault = vault; U.dvault = dvault;
    return changed;
  }
  function fillVault(U, master, slugs) { return syncVault(U, master, slugs); }
  /* The keyring a user gets from their assignment (meta) under the current policy and their rights.
     Mirror of build_ring in protect.py. */
  async function buildRing(U, master, meta) {
    var ring = { n: meta.name, p: { home: b64(await pageKey(master, "home")) }, d: {} };
    var dl = meta.download !== false;
    if (meta.contrib) ring.c = b64(await contribKey(master));
    if (meta.all) { ring.all = 1; ring.a = b64(await allKey(master)); if (dl) ring.da = b64(await dallKey(master)); return ring; }
    var pages = meta.pages || [];
    for (var i = 0; i < pages.length; i++) {
      if (canRead(U, pages[i])) ring.p[pages[i]] = b64(await keyFor(U, master, pages[i]));
      if (dl && canDownload(U, pages[i])) ring.d[pages[i]] = b64(await pdfKey(master, pages[i]));
    }
    return ring;
  }
  async function loadUsers(base) {
    var r = await fetch(base + "users.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("users.json " + r.status);
    return r.json();
  }
  async function adminMaster(U, pw) {
    var m = await pbkdf2(pw, u8(U.salt), U.iter);
    if (b64(await hmac(m, "check")) !== U.check) throw new Error("bad password");
    return m;
  }
  /* Returns a session object to store, or throws. */
  async function login(U, username, pw) {
    if (norm(username) === "admin") {
      var m = await adminMaster(U, pw);
      return { t: "a", k: b64(m) };
    }
    var id = await userId(U, username);
    var e = (U.users || []).filter(function (x) { return x.id === id; })[0];
    if (!e) throw new Error("bad login");
    var k = await pbkdf2(pw, u8(e.s), U.iter);
    await decrypt(k, e.iv, e.kr); // throws if wrong password
    return { t: "u", id: id, k: b64(k) };
  }
  /* Turns a stored session into access: {name, admin, allowed (array of slugs or null = all), key(slug)}. */
  async function access(U, s) {
    if (!s) throw new Error("no session");
    if (s.t === "a") {
      var m = u8(s.k);
      if (b64(await hmac(m, "check")) !== U.check) throw new Error("stale");
      return { name: "Admin", admin: true, allowed: null, downloadable: null, contrib: await contribKey(m),
        key: function (slug) { return keyFor(U, m, slug); }, dkey: function (slug) { return pdfKey(m, slug); } };
    }
    var e = (U.users || []).filter(function (x) { return x.id === s.id; })[0];
    if (!e) throw new Error("removed");
    var ring = JSON.parse(await decrypt(u8(s.k), e.iv, e.kr));
    var contrib = ring.c ? u8(ring.c) : null;
    if (ring.all) {
      var ak = u8(ring.a), dk = ring.da ? u8(ring.da) : null;
      var open = async function (box, slug, k) {
        var v = (box || {})[slug]; if (!v || !k) return null;
        try { return v.e ? await unwrapSuper(U, ak, v) : u8(await decrypt(k, v.iv, v.ct)); } catch (x) { return null; }
      };

        name: ring.n, admin: false, superUser: true, contrib: contrib,
        allowed: Object.keys(U.vault || {}), downloadable: dk ? Object.keys(U.dvault || {}) : [],
        key: function (slug) { if (isGuide(slug)) slug = "home"; return slug === "home" && ring.p && ring.p.home ? Promise.resolve(u8(ring.p.home)) : open(U.vault, slug, ak); },
        dkey: function (slug) { return open(U.dvault, slug, dk); }

    }

      name: ring.n, admin: false, contrib: contrib, allowed: Object.keys(ring.p), downloadable: Object.keys(d),
      key: function (slug) {
        if (isGuide(slug)) slug = "home";
        if (ring.p[slug]) return Promise.resolve(u8(ring.p[slug]));
        return contrib && isUpload(U, slug) && canRead(U, slug) ? uploadKey(contrib, slug) : Promise.resolve(null);
      },
      dkey: function (slug) { return Promise.resolve(d[slug] ? u8(d[slug]) : null); }
    };

  /* Solution names must be unique, except that versions of one solution share its name. Two names clash
     when they match ignoring case, spaces, punctuation, "&" vs "and" and a trailing "· Faclon Labs".
     Mirror of name_key / duplicate_names in protect.py. */
  function nameKey(t) {
    return String(t || "").toLowerCase().replace(/\s*[\u00b7|\u2013\u2014-]\s*faclon labs\s*$/, "").replace(/&/g, " and ")
      .normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "");
  }
  /* The existing solution name that t clashes with, or null. Ignores solution `except` and every version of
     the solution `family` (a slug of any of its versions). */
  function nameClash(U, t, except, family) {
    var k = nameKey(t), names = U.names || {}, sols = U.solutions || [], fr = family ? rootOf(U, family) : null;
    if (!k) return null;
    for (var i = 0; i < sols.length; i++) {
      var s = sols[i]; if (s.slug === except || (fr && rootOf(U, s.slug) === fr)) continue;
      var shown = names[s.slug] && names[s.slug].t ? names[s.slug].t : s.title;
      if (nameKey(shown) === k || nameKey(s.title) === k) return shown;
    }
    return null;
  }
  /* A file saved with the site's Download → HTML button bundles pages (and a frozen copy of the landing page)
     behind its own viewer. Uploading one would make its links open those frozen copies, so uploads use the
     page inside instead. Returns that page's HTML, or null if html isn't such a file. Throws when the file
     holds several solutions. Mirror of unbundle in protect.py. */
  function unbundle(html) {
    var m = /<script type="application\/json" id="data">([\s\S]*?)<\/script>/i.exec(String(html || ""));
    if (!m) return null;
    var d; try { d = JSON.parse(m[1]); } catch (e) { return null; }
    if (!d || typeof d.pages !== "object" || !d.start || !Array.isArray(d.picked)) return null;
    if (d.picked.length !== 1 || !d.pages[d.picked[0]]) throw new Error("that file is a download of several solutions. Upload one page at a time (open it, then save just that page)");
    return d.pages[d.picked[0]];
  }
  var CATS = [["core", "Core documents"], ["solution", "Solution documents"], ["maps", "Industry use case maps"],
              ["cases", "Case studies"], ["technical", "Technical documents"], ["others", "Others"]];
  function catLabel(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === id) return CATS[i][1]; return null; }

  /* Accepts a category id or label (any case); returns the id or null. */
  function catId(v) {
    var k = String(v || "").trim().toLowerCase();

    return null;

  function rootOf(U, slug) { var v = (U.versions || {})[slug]; return v ? v.of : slug; }

    m.sort(function (a, b) { return a.n - b.n; });

  /* Number the next version of base's family would get. */
  function nextVersion(U, base) {

  /* Registers slug as the newest version of base's family in J (a fresh users.json); returns its number. */

  function getSession() { try { return JSON.parse(localStorage.getItem(SESSION) || sessionStorage.getItem(SESSION) || "null"); } catch (e) { return null; } }
  function setSession(v) { var j = JSON.stringify(v); try { localStorage.setItem(SESSION, j); } catch (e) { try { sessionStorage.setItem(SESSION, j); } catch (e2) {} } }

    u8: u8, b64: b64, pbkdf2: pbkdf2, hmac: hmac, encrypt: encrypt, decrypt: decrypt, decryptBytes: decryptBytes, sha256hex: sha256hex,
    norm: norm, userId: userId, pageKey: pageKey, allKey: allKey, dallKey: dallKey, contribKey: contribKey, uploadKey: uploadKey, isUpload: isUpload, isGuide: isGuide, keyFor: keyFor, wrapForSuper: wrapForSuper, nameKey: nameKey, nameClash: nameClash, family: family, families: families, rootOf: rootOf, versionLabel: versionLabel, unbundle: unbundle, CATS: CATS, catLabel: catLabel, catOf: catOf, catId: catId, nextVersion: nextVersion, addVersion: addVersion, pdfKey: pdfKey, canRead: canRead, canDownload: canDownload, syncVault: syncVault, fillVault: fillVault, buildRing: buildRing, loadUsers: loadUsers, adminMaster: adminMaster,
    login: login, access: access, getSession: getSession, setSession: setSession, clearSession: clearSession

})();

</script>

0;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:#E5F5EE;color:#11875F}' +\n    '.in[readonly]{background:#F6F8FB;color:#3A4A5F}' +\n    '.dlink{display:inline-block;text-decoration:none;font:600 14px Inter,system-ui,sans-serif;padding:10px 16px;border-radius:9px;background:#3D63F5;color:#fff}' +\n    'ol.steps,ul.tips{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.55;color:#3A4A5F}ol.steps li,ul.tips li{margin:0 0 7px}' +\n    'ul.tips q{quotes:\"\\u201c\" \"\\u201d\";color:#0F1B2D}' +\n    'code,pre{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}' +\n    'pre{margin:8px 0 0;padding:10px 12px;background:#F6F8FB;border:1px solid #E3E8EF;border-radius:9px;white-space:pre-wrap;word-break:break-all;color:#0F1B2D}' +\n    '.dlg a{color:#3D63F5;font-weight:600}.dlg a.dlink{color:#fff}' +\n    '[hidden]{display:none!important}' +\n    '@media (max-width:560px){.bar{flex-wrap:wrap;justify-content:flex-end;row-gap:6px;border-radius:18px}}' +\n    '<\/style>' +\n    '<div class=\"bar\"><span class=\"who\"><\/span><button id=\"fsb\" type=\"button\" hidden>Full screen<\/button><button id=\"nv\" type=\"button\" hidden><\/button><button class=\"pri\" id=\"dl\" type=\"button\">Download<\/button><button id=\"upb\" type=\"button\" hidden>Upload<\/button>' +\n    (ADM ? '<button id=\"mu\" type=\"button\">Manage users<\/button>' : '') +\n    '<button id=\"so\" type=\"button\">Sign out<\/button><\/div>' +\n    '<div class=\"scrim\" id=\"scrim\" hidden><div class=\"dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dh\">' +\n    '<h2 id=\"dh\">Download<\/h2><p>Save solutions to share or open offline.<\/p>' +\n    '<div id=\"pdfSec\"><div class=\"eb\">This page as PDF<\/div><div class=\"box\"><p>One continuous page with no page breaks, exactly as it looks on screen.<\/p>' +\n    '<div class=\"row\"><span class=\"st\" id=\"pst\"><\/span><button class=\"pri big\" id=\"pdf\" type=\"button\">Download PDF<\/button><\/div><\/div><\/div>' +\n    '<div class=\"eb\">One HTML file<\/div><div class=\"box\"><p>Pick the solutions to include. You get a single file that opens in any browser, offline and without signing in.<\/p>' +\n    '<div class=\"sols\" id=\"sols\"><\/div>' +\n    '<div class=\"row\"><button class=\"link\" id=\"all\" type=\"button\">Select all<\/button><button class=\"pri big\" id=\"html\" type=\"button\">Download HTML<\/button><\/div>' +\n    '<div class=\"st\" id=\"hst\"><\/div><\/div>' +\n    '<div class=\"eb\">Design guide<\/div><div class=\"box\"><p>Building your own solution page? The design skill has the Faclon colours, fonts, layout, ready-made components and a starter page, so it matches this site. Use it yourself or give it to an AI assistant.<\/p>' +\n    '<div class=\"row\"><span class=\"st\" id=\"gst\"><\/span><a class=\"pri big dlink\" id=\"guide\" href=\"' + B + 'designskill.md\" download=\"Faclon design skill.md\">Download design skill<\/a><\/div><\/div>' +\n    '<div id=\"conSec\" hidden><div class=\"eb\">Claude connector<\/div><div class=\"box\"><p>Work with these pages from Claude: list and read the solutions you can open, save them as PDF or HTML, build a page with the design skill and publish it, just by asking. Runs in the Claude desktop app.<\/p>' +\n    '<div class=\"row\"><button class=\"link\" id=\"conHow\" type=\"button\">How to connect<\/button><a class=\"pri big dlink\" href=\"' + B + 'connector/faclon-glossary.mcpb\" download=\"faclon-glossary.mcpb\">Download connector<\/a><\/div><\/div><\/div>' +\n    '<p class=\"note\">Downloaded files are not password-protected. Share them only with people who should see these solutions.<\/p>' +\n    '<div class=\"row\" style=\"justify-content:flex-end\"><button id=\"close\" type=\"button\">Close<\/button><\/div>' +\n    '<\/div><\/div>' +\n    '<div class=\"scrim\" id=\"uscrim\" hidden><div class=\"dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"uh\">' +\n    '<h2 id=\"uh\">Upload a solution page<\/h2><p>Add a self-contained HTML page (styles and images inside the file). It goes live straight away for admin, super users and contributors; the admin can share it with other users. Building one? Follow the <a href=\"' + B + 'designskill.md\" download=\"designskill.md\" style=\"color:#3D63F5;font-weight:600\">design guide<\/a> so it matches the site. You can also upload from Claude with the <a href=\"#\" id=\"conUp\">Claude connector<\/a>.<\/p>' +\n    '<label class=\"drop\" id=\"drop\"><input type=\"file\" id=\"uf\" accept=\".html,.htm,text/html\"><span id=\"ufl\"><b>Choose an HTML file<\/b> or drop it here<\/span><\/label>' +\n    '<span class=\"fl\">Is this a newer version of an existing solution?<\/span><select class=\"in\" id=\"uv\"><option value=\"\">No, it\\u2019s a new solution<\/option><\/select>' +\n    '<p class=\"vh\" id=\"uvh\" hidden>It keeps the same name and gets the next version number automatically. Both versions stay on the site, marked v1, v2\\u2026 with the newest labelled Latest; the admin can hide older versions.<\/p>' +\n    '<span class=\"fl\">Title <span class=\"vt\" id=\"utv\" hidden><\/span><\/span><input class=\"in\" id=\"ut\" maxlength=\"80\" placeholder=\"e.g. Cooling Tower Optimisation\">' +\n    '<span class=\"fl\">Category <span class=\"vt\" id=\"ugv\" hidden>Same as the earlier version<\/span><\/span><select class=\"in\" id=\"ug\"><option value=\"\">Choose a category\\u2026<\/option>' +\n    FA.CATS.map(function (c) { return '<option value=\"' + c[0] + '\">' + c[1] + '<\/option>'; }).join(\"\") + '<\/select>' +\n    '<p class=\"vh\">The group it is listed under on the main menu.<\/p>' +\n    '<span class=\"fl\">Industry or area <em>(optional, shown above the name)<\/em><\/span><input class=\"in\" id=\"uc\" maxlength=\"40\" placeholder=\"e.g. Power, Metals, Utilities\">' +\n    '<span class=\"fl\">Your name <em>(optional, shown as \\u201cContributed by\\u201d)<\/em><\/span><input class=\"in\" id=\"un\" maxlength=\"60\">' +\n    '<div class=\"st\" id=\"ust\" style=\"margin-top:12px\"><\/div>' +\n    '<div class=\"row\" style=\"justify-content:flex-end\"><button id=\"ucancel\" type=\"button\">Cancel<\/button><button class=\"pri big\" id=\"ugo\" type=\"button\">Upload and publish<\/button><\/div>' +\n    '<\/div><\/div>' +\n    '<div class=\"scrim\" id=\"cscrim\" hidden><div class=\"dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ch\">' +\n    '<h2 id=\"ch\">Connect Claude to Faclon solutions<\/h2><p>The connector lets Claude read and download the solution pages you can open, follow the Faclon design skill and publish new pages for you. It runs on your computer in the Claude desktop app (Mac or Windows) and signs in with your Faclon username and password, which stay on your computer.<\/p>' +\n    '<div class=\"eb\">Set it up<\/div><ol class=\"steps\">' +\n    '<li><a href=\"' + B + 'connector/faclon-glossary.mcpb\" download=\"faclon-glossary.mcpb\">Download the connector<\/a> (faclon-glossary.mcpb).<\/li>' +\n    '<li>Open the Claude desktop app and go to <b>Settings \\u2192 Extensions<\/b>. Drag the file onto that page, or double-click the file, then click <b>Install<\/b>.<\/li>' +\n    '<li>Enter your Faclon username and password, the same ones you use to sign in here. You can also pick the folder downloads are saved to.<\/li>' +\n    '<li>Check the extension is switched on, then start a new chat.<\/li><\/ol>' +\n    '<div class=\"eb\">Things to ask Claude<\/div><ul class=\"tips\">' +\n    '<li><q>Which Faclon solutions can I open?<\/q><\/li>' +\n    '<li><q>Summarise the Steam Trap page for a plant head.<\/q><\/li>' +\n    '<li><q>Save the I/O Vision and Energy Management pages as PDF.<\/q><\/li>' +\n    '<li><q>Get the Faclon design skill and build a solution page on cooling tower optimisation from my notes.<\/q><\/li>' +\n    '<li><q>Upload cooling-tower.html from my Desktop as Cooling Tower Optimisation, under Solution documents.<\/q><\/li><\/ul>' +\n    '<div class=\"eb\">Good to know<\/div><ul class=\"tips\">' +\n    '<li>You get the same pages and download rights as on this site. Uploads go live straight away, as with the Upload button, so Claude checks with you before publishing.<\/li>' +\n    '<li>If your password or access changes, update it in Claude under <b>Settings \\u2192 Extensions \\u2192 Faclon Labs solutions<\/b>.<\/li>' +\n    '<li>Claude on the web and the phone app can\\u2019t use it, because it runs on your computer.<\/li>' +\n    '<li>Files Claude saves for you are not password-protected. Share them only with people who should see them.<\/li>' +\n    '<li>Using Claude Code? Download the <a href=\"' + B + 'connector/faclon-glossary-connector.js\" download=\"faclon-glossary-connector.js\">single-file connector<\/a> (needs Node.js 18 or later) and run:<pre id=\"ccmd\"><\/pre><\/li><\/ul>' +\n    '<div class=\"row\" style=\"justify-content:flex-end\"><button class=\"pri\" id=\"cclose\" type=\"button\">Done<\/button><\/div>' +\n    '<\/div><\/div>';\n  var $ = function (id) { return root.querySelector(\"#\" + id); };\n  root.querySelector(\".who\").textContent = N;\n  // 3. site-wide full screen. Browsers leave full screen whenever a page changes, so full screen\n  //    shows the site inside one frame (#fa-fs) and pages change inside that frame instead.\n  var shell = null;\n  try { if (window.parent !== window && window.parent.document.getElementById(\"fa-fs\")) shell = window.parent; } catch (e) {}\n  var topWin = shell || window;\n  function fsEnter() {\n    if (document.getElementById(\"fa-fs\")) return;\n    var box = document.createElement(\"div\"), f = document.createElement(\"iframe\");\n    box.id = \"fa-fs\";\n    box.setAttribute(\"style\", \"position:fixed;inset:0;z-index:2147483647;background:#0B1A30\");\n    f.setAttribute(\"allow\", \"fullscreen\");\n    f.setAttribute(\"title\", document.title);\n    f.setAttribute(\"style\", \"border:0;width:100%;height:100%;display:block;background:#fff\");\n    f.src = location.href;\n    f.onload = function () { try { f.contentWindow.focus(); } catch (e) {} };\n    box.appendChild(f); document.body.appendChild(box);\n    function done() {\n      if (document.fullscreenElement === box) return;\n      document.removeEventListener(\"fullscreenchange\", done);\n      var href = null; try { href = f.contentWindow.location.href; } catch (e) {}\n      box.remove();\n      // leaving full screen: stay on the page that was open in it\n      if (href && href !== \"about:blank\" && href.split(\"#\")[0] !== location.href.split(\"#\")[0]) location.href = href;\n    }\n    document.addEventListener(\"fullscreenchange\", done);\n    try {\n      var p = box.requestFullscreen();\n      if (p && p.catch) p.catch(function () { document.removeEventListener(\"fullscreenchange\", done); box.remove(); });\n    } catch (e) { document.removeEventListener(\"fullscreenchange\", done); box.remove(); }\n  }\n  function fsToggle() {\n    if (shell) { try { shell.document.exitFullscreen(); } catch (e) {} return; }\n    if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); return; }\n    fsEnter();\n  }\n  if (shell || document.fullscreenEnabled) {\n    $(\"fsb\").hidden = false;\n    if (shell) $(\"fsb\").textContent = \"Exit full screen\";\n    $(\"fsb\").onclick = fsToggle;\n    // pages with their own full-screen button (#fs, e.g. the Overview) use the site-wide one\n    document.addEventListener(\"click\", function (e) {\n      var b = e.target && e.target.closest && e.target.closest(\"#fs\");\n      if (!b) return;\n      e.preventDefault(); e.stopImmediatePropagation(); fsToggle();\n    }, true);\n  }\n  // inside the full-screen frame, links to other websites open in a new tab (many sites refuse to load in a frame)\n  if (shell) document.addEventListener(\"click\", function (e) {\n    var a = e.target && e.target.closest && e.target.closest(\"a[href]\");\n    if (!a || a.target || a.hasAttribute(\"download\")) return;\n    var u;   var args=[acc.allowed,acc.name,acc.admin,D.base,U.solutions||[],D.slug,acc.downloadable,U.policy||{}].map(function(v){return JSON.stringify(v).replace(/</g,"\\u003c")}).join(",");
  var js='<script>'+$("fa-core").textContent+'\n'+TOOLS+'\nFTOOLS('+args+')<\/script>';
  var i=html.toLowerCase().lastIndexOf("</body>");
  return i<0?html+js:html.slice(0,i)+js+html.slice(i);
}
function show(html){function go(){document.open();document.write(html);document.close()}if(document.readyState==="complete")go();else window.addEventListener("load",go)}
async function open(U,acc){
  var k=await acc.key(D.slug);
  if(!k&&!(U.solutions||[]).some(function(x){return x.slug===D.slug})){pending(acc);return}
  if(!k){gate.hidden=true;$("who").textContent=acc.name;if(!FA.canRead(U,D.slug)){$("nah").textContent="This solution isn't available right now";$("nap").textContent="It has been switched off for all users. Ask your Faclon contact if you need it."}$("home").href=D.base||"./";noacc.hidden=false;return}
  var html=await FA.decrypt(k,D.iv,D.ct);
  show(after(D.up?sandboxed(html):html,acc,U));
}
/* Contributor uploads run in a sandboxed frame: their scripts can't reach the site's storage or logins. */
function sandboxed(html){
  var dir=location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/,"");
  var baseTag='<base href="'+dir+'" target="_top">';
  var src=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+baseTag}):baseTag+html;
  var t=(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||"Faclon Labs";
  var attr=function(x){return String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")};
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>'+t+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">'+
    '<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body>'+
    '<iframe title="'+attr(t)+'" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-forms allow-modals allow-downloads" srcdoc="'+attr(src)+'"></iframe></body></html>';
}
$("out").onclick=function(){FA.clearSession();noacc.hidden=true;gate.hidden=false;gate.style.visibility="visible";$("u").focus()};
var U;
try{U=await FA.loadUsers(D.base)}catch(e){gate.style.visibility="visible";err.textContent="Couldn't reach the site. Check your connection and reload.";$("go").disabled=true;return}
/* A page that can't be unlocked yet (just uploaded: the user list on the site catches up within a minute)
   must not sign anyone out; only a session the user list rejects does. */
function pending(acc){gate.hidden=true;$("who").textContent=acc.name;$("nah").textContent="This page is still being published";
  $("nap").textContent="It was added a moment ago and will open in about a minute. Reload the page to try again; you stay signed in.";
  $("home").href=D.base||"./";$("out").textContent="Reload";$("out").onclick=function(){location.reload()};noacc.hidden=false}
var s=FA.getSession();
if(s){var acc=null;try{acc=await FA.access(U,s)}catch(e){FA.clearSession();if(e.message==="removed")$("lead").textContent="Your access has changed. Please sign in again."}
  if(acc){try{await open(U,acc)}catch(e){pending(acc)}return}}
gate.style.visibility="visible";$("u").focus();
$("f").addEventListener("submit",async function(e){
  e.preventDefault();var b=$("go");b.disabled=true;b.textContent="Checking…";err.textContent="";
  try{var s=await FA.login(U,$("u").value,$("pw").value);var acc=await FA.access(U,s);FA.setSession(s)}
  catch(x){err.textContent="That username and password didn't match. Try again.";b.disabled=false;b.textContent="Sign in";return}
  try{await open(U,acc)}catch(x){pending(acc)}
});
})();
</script>
</body></html>
